<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pages</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #f5f5f5;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      width: 100%;
      padding: 48px 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
      color: #111;
    }
    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .menu a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      text-decoration: none;
      color: #222;
      font-size: 15px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .menu a:hover {
      border-color: #aaa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .menu a .label { font-weight: 500; }
    .menu a .arrow { color: #aaa; font-size: 18px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Pages</h1>
    <ul class="menu">
      <li>
        <a href="travel/">
          <span class="label">旅行</span>
          <span class="arrow">›</span>
        </a>
      </li>
      <li>
        <a href="appliance-advisor/">
          <span class="label">家電製品アドバイザー 学習サイト</span>
          <span class="arrow">›</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
