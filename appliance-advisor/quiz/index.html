<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>クイズモード | 家電製品アドバイザー学習サイト</title>
  <style>
    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #dbeafe;
      --accent: #f59e0b;
      --success: #10b981;
      --success-bg: #d1fae5;
      --error: #ef4444;
      --error-bg: #fee2e2;
      --text: #1f2937;
      --text-muted: #6b7280;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }

    /* ===== HEADER ===== */
    .app-header {
      background: var(--primary);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-back {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      padding: 8px;
      margin: -8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .header-back:active { background: rgba(255,255,255,0.2); }
    .header-title {
      font-size: 17px;
      font-weight: 600;
      flex: 1;
    }
    .header-badge {
      background: rgba(255,255,255,0.2);
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none;
      min-height: calc(100vh - 56px);
      animation: fadeIn 0.2s ease;
    }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ===== COURSE SELECTION ===== */
    .hero {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: #fff;
      padding: 32px 20px 40px;
      text-align: center;
    }
    .hero-icon { font-size: 48px; margin-bottom: 12px; }
    .hero h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .hero p { font-size: 14px; opacity: 0.85; line-height: 1.6; }

    .course-list {
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .course-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
      width: 100%;
      box-shadow: var(--shadow);
    }
    .course-card:active { transform: scale(0.98); box-shadow: none; }
    .course-card.av { border-color: #3b82f6; }
    .course-card.home { border-color: #10b981; }
    .course-card.all { border-color: var(--accent); }
    .course-card:hover { box-shadow: var(--shadow-lg); }
    .course-icon {
      font-size: 36px;
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
    }
    .course-card.av .course-icon { background: #eff6ff; }
    .course-card.home .course-icon { background: #f0fdf4; }
    .course-card.all .course-icon { background: #fffbeb; }
    .course-info { flex: 1; }
    .course-name { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .course-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .course-count {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .course-card.av .course-count { background: #dbeafe; color: #1d4ed8; }
    .course-card.home .course-count { background: #d1fae5; color: #065f46; }
    .course-card.all .course-count { background: #fef3c7; color: #92400e; }

    .info-box {
      margin: 0 16px 20px;
      background: var(--primary-light);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 13px;
      color: var(--primary-dark);
      line-height: 1.6;
    }
    .info-box strong { display: block; margin-bottom: 4px; }

    /* ===== CATEGORY SELECTION ===== */
    .screen-title {
      padding: 20px 16px 8px;
      font-size: 18px;
      font-weight: 700;
    }
    .screen-subtitle {
      padding: 0 16px 16px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .category-list {
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .cat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.15s;
      box-shadow: var(--shadow);
      width: 100%;
      text-align: left;
    }
    .cat-card:active { transform: scale(0.98); }
    .cat-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); }
    .cat-icon {
      font-size: 26px;
      width: 44px;
      height: 44px;
      background: var(--primary-light);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .cat-name { font-size: 16px; font-weight: 600; flex: 1; }
    .cat-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .cat-arrow { color: var(--text-muted); font-size: 20px; }

    .random-btn {
      margin: 0 16px 24px;
      background: linear-gradient(135deg, var(--accent) 0%, #f97316 100%);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 18px;
      width: calc(100% - 32px);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(245,158,11,0.4);
      transition: all 0.15s;
    }
    .random-btn:active { transform: scale(0.97); box-shadow: none; }

    /* ===== QUIZ SCREEN ===== */
    .quiz-progress-bar {
      height: 4px;
      background: var(--border);
    }
    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #60a5fa);
      transition: width 0.4s ease;
    }
    .quiz-header-info {
      padding: 16px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quiz-counter {
      font-size: 14px;
      font-weight: 600;
      color: var(--primary);
    }
    .quiz-category-tag {
      font-size: 12px;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .quiz-question-box {
      padding: 20px 20px 16px;
    }
    .quiz-question-text {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.65;
      color: var(--text);
    }
    .quiz-choices {
      padding: 0 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      min-height: 56px;
    }
    .choice-btn:active { transform: scale(0.98); }
    .choice-btn:not(.disabled):hover { border-color: var(--primary); background: var(--primary-light); }
    .choice-label {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .choice-text { flex: 1; }
    .choice-btn.selected { border-color: var(--primary); background: var(--primary-light); }
    .choice-btn.selected .choice-label { background: var(--primary); border-color: var(--primary); color: #fff; }
    .choice-btn.correct { border-color: var(--success); background: var(--success-bg); }
    .choice-btn.correct .choice-label { background: var(--success); border-color: var(--success); color: #fff; }
    .choice-btn.wrong { border-color: var(--error); background: var(--error-bg); }
    .choice-btn.wrong .choice-label { background: var(--error); border-color: var(--error); color: #fff; }
    .choice-btn.disabled { cursor: default; }

    /* 解説ボックス */
    .explanation-box {
      margin: 0 16px 16px;
      padding: 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      display: none;
    }
    .explanation-box.show { display: block; animation: fadeIn 0.2s ease; }
    .explanation-box.correct-result {
      background: var(--success-bg);
      border: 1.5px solid var(--success);
      color: #065f46;
    }
    .explanation-box.wrong-result {
      background: var(--error-bg);
      border: 1.5px solid var(--error);
      color: #991b1b;
    }
    .explanation-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .explanation-correct {
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* 次へボタン（固定フッター） */
    .quiz-footer {
      position: sticky;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }
    .next-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 17px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: none;
    }
    .next-btn.show { display: block; animation: fadeIn 0.2s ease; }
    .next-btn:active { transform: scale(0.98); background: var(--primary-dark); }

    /* ===== RESULT SCREEN ===== */
    .result-hero {
      padding: 36px 24px 28px;
      text-align: center;
    }
    .result-score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .result-score-circle svg {
      position: absolute;
      top: 0; left: 0;
      transform: rotate(-90deg);
    }
    .score-inner {
      position: relative;
      z-index: 1;
    }
    .score-num { font-size: 42px; font-weight: 800; line-height: 1; }
    .score-denom { font-size: 14px; color: var(--text-muted); font-weight: 600; }
    .result-message { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .result-sub { font-size: 14px; color: var(--text-muted); }

    .result-stats {
      margin: 0 16px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .stat-num { font-size: 28px; font-weight: 800; }
    .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .stat-card.correct .stat-num { color: var(--success); }
    .stat-card.wrong .stat-num { color: var(--error); }

    .result-list {
      margin: 0 16px 20px;
    }
    .result-list-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text-muted);
    }
    .result-item {
      background: var(--surface);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .result-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
    .result-q { font-size: 14px; line-height: 1.5; flex: 1; }
    .result-a { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    .result-a span { font-weight: 600; }

    .result-actions {
      padding: 0 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-retry {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 17px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-retry:active { transform: scale(0.98); }
    .btn-back-cat {
      background: var(--surface);
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      padding: 15px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-back-cat:active { transform: scale(0.98); }
    .btn-study-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
      padding: 8px;
      text-align: center;
    }

    /* ===== UTILS ===== */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0;
    }
    .section-header {
      padding: 20px 16px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Desktop layout */
    @media (min-width: 600px) {
      .screen { max-width: 480px; margin: 0 auto; }
      .app-header { max-width: 480px; margin: 0 auto; left: 0; right: 0; }
      html { background: #e2e8f0; }
      body { background: #e2e8f0; }
      .screen { background: var(--bg); min-height: calc(100vh - 56px); box-shadow: var(--shadow-lg); }
    }
  </style>
</head>
<body>

<header class="app-header" id="appHeader">
  <button class="header-back" id="headerBack" onclick="goBack()" style="display:none">‹</button>
  <span class="header-title" id="headerTitle">クイズモード</span>
  <span class="header-badge" id="headerBadge" style="display:none"></span>
</header>

<!-- ===== SCREEN 1: コース選択 ===== -->
<div class="screen active" id="screenCourse">
  <div class="hero">
    <div class="hero-icon">📝</div>
    <h1>コース別クイズ</h1>
    <p>カテゴリを選んで知識を確認しよう<br>全60問・各カテゴリ10問</p>
  </div>

  <div class="course-list">
    <button class="course-card av" onclick="selectCourse('av')">
      <div class="course-icon">📺</div>
      <div class="course-info">
        <div class="course-name">AV情報家電コース</div>
        <div class="course-desc">電気の基礎・AV家電・法規・販売・環境</div>
      </div>
      <span class="course-count">5カテゴリ</span>
    </button>

    <button class="course-card home" onclick="selectCourse('home')">
      <div class="course-icon">🏠</div>
      <div class="course-info">
        <div class="course-name">生活家電コース</div>
        <div class="course-desc">電気の基礎・生活家電・法規・販売・環境</div>
      </div>
      <span class="course-count">5カテゴリ</span>
    </button>

    <button class="course-card all" onclick="selectCourse('all')">
      <div class="course-icon">🎯</div>
      <div class="course-info">
        <div class="course-name">全カテゴリ（総合）</div>
        <div class="course-desc">6カテゴリすべてをカバー</div>
      </div>
      <span class="course-count">6カテゴリ</span>
    </button>
  </div>

  <div class="info-box">
    <strong>📌 クイズの使い方</strong>
    コースを選んでカテゴリを指定するか、ランダム出題で総合的に力試し。解答後に解説が表示されます。
  </div>

  <div style="text-align:center; padding: 0 16px 24px;">
    <a href="../" style="color:var(--text-muted); font-size:14px; text-decoration:none;">← 学習サイトトップへ戻る</a>
  </div>
</div>

<!-- ===== SCREEN 2: カテゴリ選択 ===== -->
<div class="screen" id="screenCategory">
  <div class="screen-title" id="catScreenTitle">カテゴリを選択</div>
  <div class="screen-subtitle" id="catScreenSub">出題したいカテゴリを選んでください</div>

  <button class="random-btn" id="randomBtn" onclick="startRandom()">
    🎲 ランダム出題（全カテゴリ混合 10問）
  </button>

  <div class="section-header">カテゴリ別</div>
  <div class="category-list" id="categoryList"></div>
</div>

<!-- ===== SCREEN 3: クイズ ===== -->
<div class="screen" id="screenQuiz">
  <div class="quiz-progress-bar">
    <div class="quiz-progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="quiz-header-info">
    <span class="quiz-counter" id="quizCounter">問1 / 10</span>
    <span class="quiz-category-tag" id="quizCatTag"></span>
  </div>
  <div class="quiz-question-box">
    <p class="quiz-question-text" id="questionText"></p>
  </div>
  <div class="quiz-choices" id="choicesContainer"></div>
  <div class="explanation-box" id="explanationBox">
    <div class="explanation-title" id="explanationTitle"></div>
    <div class="explanation-correct" id="explanationCorrect"></div>
    <div id="explanationText"></div>
  </div>
  <div style="height: 80px"></div>
  <div class="quiz-footer">
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
  </div>
</div>

<!-- ===== SCREEN 4: 結果 ===== -->
<div class="screen" id="screenResult">
  <div class="result-hero">
    <div class="result-score-circle" id="scoreCircle">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="70" cy="70" r="60" fill="none" stroke="#e5e7eb" stroke-width="10"/>
        <circle cx="70" cy="70" r="60" fill="none" stroke="#1e40af" stroke-width="10"
          stroke-dasharray="377" stroke-dashoffset="377" id="scoreArc" stroke-linecap="round"/>
      </svg>
      <div class="score-inner">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-denom" id="scoreDenom">/ 10問</div>
      </div>
    </div>
    <div class="result-message" id="resultMessage"></div>
    <div class="result-sub" id="resultSub"></div>
  </div>

  <div class="result-stats">
    <div class="stat-card correct">
      <div class="stat-num" id="statCorrect">0</div>
      <div class="stat-label">✅ 正解</div>
    </div>
    <div class="stat-card wrong">
      <div class="stat-num" id="statWrong">0</div>
      <div class="stat-label">❌ 不正解</div>
    </div>
  </div>

  <div class="result-list">
    <div class="result-list-title">問題の振り返り</div>
    <div id="resultItems"></div>
  </div>

  <div class="result-actions">
    <button class="btn-retry" onclick="retryQuiz()">🔄 同じカテゴリでもう一度</button>
    <button class="btn-back-cat" onclick="backToCategory()">← カテゴリ選択に戻る</button>
    <button class="btn-study-link" id="studyLink" onclick="goToStudy()">📚 このカテゴリの学習ページへ</button>
  </div>
</div>

<script>
// ============================
// QUESTION BANK
// ============================
const QUESTIONS = {
  basics: {
    name: '電気の基礎',
    icon: '🔌',
    studyUrl: '../basics/',
    qs: [
      {
        q: '100Vの電圧をかけると5Aの電流が流れた。このときの抵抗値は？',
        choices: ['20Ω', '500Ω', '0.05Ω', '5Ω'],
        ans: 0,
        exp: 'オームの法則 R = E/I より、R = 100V ÷ 5A = 20Ω。電圧・電流・抵抗の関係を表すオームの法則は試験の基本。'
      },
      {
        q: '日本の商用電源の周波数（東日本・西日本）について正しいものは？',
        choices: ['東日本60Hz・西日本50Hz', '東日本50Hz・西日本60Hz', '全国統一で50Hz', '全国統一で60Hz'],
        ans: 1,
        exp: '日本では東日本（東京電力管内等）が50Hz、西日本（中部・関西以西）が60Hz。富士川・糸魚川付近が境界。'
      },
      {
        q: '100Wの電球を5時間使用したときの電力量として正しいものは？',

// コース定義
const COURSES = {
  av: {
    name: 'AV情報家電コース',
    categories: ['basics', 'avInfo', 'laws', 'sales', 'environment']
  },
  home: {
    name: '生活家電コース',
    categories: ['basics', 'homeAppliances', 'laws', 'sales', 'environment']
  },
  all: {
    name: '全カテゴリ',
    categories: ['basics', 'avInfo', 'homeAppliances', 'laws', 'sales', 'environment']
  }
};

// ============================
// STATE
// ============================
let currentCourse = null;
let currentCategory = null;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let answers = [];
let selectedAnswer = null;
let screenHistory = [];

// ============================
// NAVIGATION
// ============================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goBack() {
  if (screenHistory.length > 0) {
    const prev = screenHistory.pop();
    showScreen(prev);
    updateHeader(prev);
  }
}

function updateHeader(screenId) {
  const back = document.getElementById('headerBack');
  const title = document.getElementById('headerTitle');
  const badge = document.getElementById('headerBadge');
  badge.style.display = 'none';

  if (screenId === 'screenCourse') {
    back.style.display = 'none';
    title.textContent = 'クイズモード';
  } else if (screenId === 'screenCategory') {
    back.style.display = 'flex';
    title.textContent = currentCourse ? COURSES[currentCourse].name : 'カテゴリ選択';
  } else if (screenId === 'screenQuiz') {
    back.style.display = 'flex';
    title.textContent = currentCategory ? QUESTIONS[currentCategory].name : 'クイズ';
    badge.style.display = 'block';
    badge.textContent = `${currentIndex + 1}/${currentQuestions.length}`;
  } else if (screenId === 'screenResult') {
    back.style.display = 'none';
    title.textContent = '結果';
  }
}

function navigateTo(screenId) {
  const currentActive = document.querySelector('.screen.active');
  if (currentActive) screenHistory.push(currentActive.id);
  showScreen(screenId);
  updateHeader(screenId);
}

// ============================
// COURSE SELECTION
// ============================
function selectCourse(course) {
  currentCourse = course;
  buildCategoryScreen();
  navigateTo('screenCategory');
}

function buildCategoryScreen() {
  const cats = COURSES[currentCourse].categories;
  document.getElementById('catScreenTitle').textContent = COURSES[currentCourse].name;
  document.getElementById('catScreenSub').textContent = '出題したいカテゴリを選択してください';

  const list = document.getElementById('categoryList');
  list.innerHTML = '';

  cats.forEach(key => {
    const cat = QUESTIONS[key];
    const btn = document.createElement('button');
    btn.className = 'cat-card';
    btn.innerHTML = `
      <div class="cat-icon">${cat.icon}</div>
      <div style="flex:1">
        <div class="cat-name">${cat.name}</div>
        <div class="cat-meta">${cat.qs.length}問</div>
      </div>
      <span class="cat-arrow">›</span>
    `;
    btn.onclick = () => startQuiz(key);
    list.appendChild(btn);
  });
}

// ============================
// QUIZ START
// ============================
function startQuiz(categoryKey) {
  currentCategory = categoryKey;
  const cat = QUESTIONS[categoryKey];
  currentQuestions = shuffle([...cat.qs]).slice(0, 10);
  currentIndex = 0;
  score = 0;
  answers = [];
  navigateTo('screenQuiz');
  renderQuestion();
}

function startRandom() {
  currentCategory = null;
  const cats = COURSES[currentCourse].categories;
  const pool = [];
  cats.forEach(key => {
    QUESTIONS[key].qs.forEach(q => pool.push({ ...q, _category: key }));
  });
  currentQuestions = shuffle(pool).slice(0, 10);
  currentIndex = 0;
  score = 0;
  answers = [];
  navigateTo('screenQuiz');
  renderQuestion();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ============================
// QUIZ RENDERING
// ============================
function renderQuestion() {
  const q = currentQuestions[currentIndex];
  const total = currentQuestions.length;
  const catKey = q._category || currentCategory;
  const catName = catKey ? QUESTIONS[catKey].name : '総合';

  // Header badge
  document.getElementById('headerBadge').textContent = `${currentIndex + 1}/${total}`;
  document.getElementById('headerBadge').style.display = 'block';

  // Progress
  document.getElementById('progressFill').style.width = `${(currentIndex / total) * 100}%`;
  document.getElementById('quizCounter').textContent = `問${currentIndex + 1} / ${total}`;
  document.getElementById('quizCatTag').textContent = catName;

  // Question
  document.getElementById('questionText').textContent = q.q;

  // Choices
  const container = document.getElementById('choicesContainer');
  container.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  q.choices.forEach((choice, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${labels[i]}</span><span class="choice-text">${choice}</span>`;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });

  // Reset state
  selectedAnswer = null;
  const expBox = document.getElementById('explanationBox');
  expBox.className = 'explanation-box';
  document.getElementById('nextBtn').className = 'next-btn';
}

function selectAnswer(idx) {
  if (selectedAnswer !== null) return;
  selectedAnswer = idx;

  const q = currentQuestions[currentIndex];
  const isCorrect = idx === q.ans;
  if (isCorrect) score++;

  answers.push({ q: q.q, chosen: idx, correct: q.ans, isCorrect, choices: q.choices, exp: q.exp });

  // Style buttons
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.ans) btn.classList.add('correct');
    else if (i === idx && !isCorrect) btn.classList.add('wrong');
  });

  // Explanation
  const expBox = document.getElementById('explanationBox');
  expBox.className = `explanation-box show ${isCorrect ? 'correct-result' : 'wrong-result'}`;
  document.getElementById('explanationTitle').innerHTML = isCorrect ? '✅ 正解！' : '❌ 不正解';
  const labels = ['A', 'B', 'C', 'D'];
  document.getElementById('explanationCorrect').textContent = isCorrect ? '' : `正解：${labels[q.ans]}. ${q.choices[q.ans]}`;
  document.getElementById('explanationText').textContent = q.exp;

  // Next button
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.className = 'next-btn show';
  nextBtn.textContent = currentIndex + 1 >= currentQuestions.length ? '結果を見る →' : '次の問題へ →';

  // Auto-scroll to explanation on mobile
  setTimeout(() => {
    expBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    showResult();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ============================
// RESULT
// ============================
function showResult() {
  const total = currentQuestions.length;
  const pct = Math.round((score / total) * 100);

  navigateTo('screenResult');
  window.scrollTo({ top: 0 });

  document.getElementById('scoreNum').textContent = score;
  document.getElementById('scoreDenom').textContent = `/ ${total}問`;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = total - score;

  // Arc animation
  const arc = document.getElementById('scoreArc');
  const circumference = 2 * Math.PI * 60;
  const offset = circumference - (pct / 100) * circumference;
  arc.style.strokeDashoffset = circumference;
  arc.style.transition = 'none';
  setTimeout(() => {
    arc.style.transition = 'stroke-dashoffset 1s ease';
    arc.style.strokeDashoffset = offset;
    const color = pct >= 80 ? '#10b981' : pct >= 60 ? '#f59e0b' : '#ef4444';
    arc.style.stroke = color;
    document.getElementById('scoreNum').style.color = color;
  }, 100);

  // Message
  let msg, sub;
  if (pct >= 90) { msg = '🎉 素晴らしい！'; sub = '完璧な理解です！'; }
  else if (pct >= 80) { msg = '👏 よくできました！'; sub = 'ほぼ完璧です。'; }
  else if (pct >= 60) { msg = '📚 もう少し！'; sub = '苦手な問題を復習しましょう。'; }
  else { msg = '💪 復習が必要です'; sub = '学習ページで確認しましょう。'; }
  document.getElementById('resultMessage').textContent = msg;
  document.getElementById('resultSub').textContent = sub;

  // Answer list
  const items = document.getElementById('resultItems');
  items.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];
  answers.forEach((a, i) => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `
      <div class="result-icon">${a.isCorrect ? '✅' : '❌'}</div>
      <div>
        <div class="result-q">問${i + 1}. ${a.q}</div>
        <div class="result-a">正解：<span>${labels[a.correct]}. ${a.choices[a.correct]}</span></div>
      </div>
    `;
    items.appendChild(div);
  });

  // Study link
  const catKey = currentCategory || (currentQuestions[0] && currentQuestions[0]._category);
  if (catKey) {
    document.getElementById('studyLink').style.display = 'block';
    document.getElementById('studyLink').dataset.url = QUESTIONS[catKey].studyUrl;
  } else {
    document.getElementById('studyLink').style.display = 'none';
  }
}

function retryQuiz() {
  if (currentCategory) {
    startQuiz(currentCategory);
  } else {
    startRandom();
  }
}

function backToCategory() {
  screenHistory = [];
  navigateTo('screenCategory');
}

function goToStudy() {
  const url = document.getElementById('studyLink').dataset.url;
  if (url) window.location.href = url;
}
</script>
