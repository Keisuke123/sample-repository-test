<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIニュース</title>
  <meta name="description" content="AI業界の重要ニュースを毎朝まとめるページ">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M7 20 14 7l7 13Z" fill="none" stroke="var(--axis)" stroke-width="1.5" stroke-linejoin="round"/>
          <circle class="node" cx="14" cy="7" r="3.5" fill="var(--cat-a)"/>
          <circle class="node" cx="21" cy="20" r="3.5" fill="var(--cat-b)"/>
          <circle class="node" cx="7" cy="20" r="3.5" fill="var(--cat-c)"/>
        </svg>
        <span>AIニュース</span>
      </div>
      <nav class="day-switch" aria-label="日付の切り替え">
        <button type="button" id="prev" aria-label="前の日">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="current" id="current-date">-</span>
        <button type="button" id="next" aria-label="次の日">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container" id="app">
    <p class="message">読み込み中...</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>毎朝、直近24時間（月曜は週末を含む72時間）の重要ニュースを最大9件掲載しています。直近30日分を表示します。</p>
      <p id="generated-at"></p>
    </div>
  </footer>

  <script>
    // カテゴリの表示情報。コード（A/B/C）と名前は schema.json の categories と揃える
    const CATEGORIES = {
      A: {
        name: "モデル・製品",
        desc: "新しいAIモデルの発表、主要プロダクトの新機能・価格改定、クラウドでの提供開始",
        icon: '<path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7z"/><path d="m3.5 7 8.5 4.5L20.5 7M12 11.5v10"/>',
      },
      B: {
        name: "ハーネス・エージェント",
        desc: "コーディングエージェントの主要アップデート、エージェントSDK、MCPなどのプロトコル",
        icon: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7.5 9.5 3 2.5-3 2.5M13 15h3.5"/>',
      },
      C: {
        name: "OSS",
        desc: "オープンウェイトモデルの公開、推論・学習・エージェント系OSSのメジャーリリース",
        icon: '<circle cx="6" cy="5.5" r="2.5"/><circle cx="6" cy="18.5" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8v8M18 10.5c0 4.5-7 3-11 6"/>',
      },
    };
    const MAX_PER_CAT = 3;
    const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
    const ICON_BULB = '<path d="M9 18h6M10 21.5h4M12 2.5a6.5 6.5 0 0 0-3.8 11.8c.5.4.8 1 .8 1.6V16h6v-.1c0-.6.3-1.2.8-1.6A6.5 6.5 0 0 0 12 2.5z"/>';
    const ICON_LINK = '<path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/>';
    const ICON_CALM = '<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>';

    const state = { issues: [], date: null, cache: new Map(), chartDrawn: false };

    // ---------- 共通 ----------
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      for (const child of children) node.append(child);
      return node;
    }

    function svgIcon(paths) {
      // paths はこのファイル内の定数のみ（外部データは渡さない）
      const span = document.createElement("span");
      span.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
      return span.firstChild;
    }

    function svg(tag, attrs = {}) {
      const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      return node;
    }

    function parseDate(date) {
      const [y, m, d] = date.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDate(date, withYear = true) {
      const dt = parseDate(date);
      const md = `${dt.getMonth() + 1}/${dt.getDate()}`;
      return `${withYear ? dt.getFullYear() + "/" : ""}${md}（${WEEKDAYS[dt.getDay()]}）`;
    }

    function safeUrl(url) {
      return typeof url === "string" && /^https?:\/\//.test(url) ? url : null;
    }

    function hostOf(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch (e) {
        return url;
      }
    }

    function countByCat(items) {
      const counts = { A: 0, B: 0, C: 0 };
      for (const item of items) if (item.cat in counts) counts[item.cat]++;
      return counts;
    }

    async function fetchJson(path) {
      const res = await fetch(path, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return res.json();
    }

    async function loadIssue(date) {
      if (!state.cache.has(date)) state.cache.set(date, await fetchJson(`data/${date}.json`));
      return state.cache.get(date);
    }

    // スクロールで要素をふわっと表示する
    const revealer = "IntersectionObserver" in window
      ? new IntersectionObserver((entries) => {
          for (const e of entries) {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              revealer.unobserve(e.target);
            }
          }
        }, { rootMargin: "0px 0px -40px 0px" })
      : null;

    function reveal(node, delay = 0) {
      node.classList.add("reveal");
      node.style.setProperty("--delay", `${delay}s`);
      if (revealer) revealer.observe(node);
      else node.classList.add("in");
      return node;
    }

    // ---------- 対象期間の図 ----------
    // period の文字列から開始・終了日時を読み取る。読めなければ曜日から推定する
    function parsePeriod(issue) {
      const re = /(\d{4})\/(\d{1,2})\/(\d{1,2})[^0-9]*?(\d{1,2}):(\d{2})/g;
      const found = [...String(issue.period || "").matchAll(re)].map((m) => new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5]));
      if (found.length >= 2 && found[1] > found[0]) return { start: found[0], end: found[1], exact: true };
      const end = parseDate(issue.date);
      end.setHours(8, 30);
      const hours = end.getDay() === 1 ? 72 : 24;
      return { start: new Date(end - hours * 3600e3), end, exact: false };
    }

    function renderPeriod(issue) {
      const { start, end, exact } = parsePeriod(issue);
      const hours = Math.round((end - start) / 3600e3);
      const axisStart = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      const axisEnd = new Date(end.getFullYear(), end.getMonth(), end.getDate() + 1);
      const span = axisEnd - axisStart;
      const pos = (t) => ((t - axisStart) / span) * 100;
      const hm = (t) => `${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;

      const timeline = el("div", { class: "timeline", role: "img", "aria-label": `対象期間：${issue.period || ""}` });
      timeline.append(el("div", { class: "track" }));
      const days = Math.round(span / 86400e3);
      for (let i = 0; i < days; i++) {
        const d = new Date(axisStart.getFullYear(), axisStart.getMonth(), axisStart.getDate() + i);
        if (i > 0) {
          const tick = el("div", { class: "tick" });
          tick.style.left = `${pos(d)}%`;
          timeline.append(tick);
        }
        const label = el("div", { class: "day" });
        label.textContent = `${d.getMonth() + 1}/${d.getDate()}（${WEEKDAYS[d.getDay()]}）`;
        label.style.left = `${pos(d) + 50 / days}%`;
        timeline.append(label);
      }
      const win = el("div", { class: "window" });
      win.style.left = `${pos(start)}%`;
      win.style.width = `${pos(end) - pos(start)}%`;
      timeline.append(win);
      const now = el("div", { class: "now" });
      now.style.left = `${pos(end)}%`;
      timeline.append(now);
      if (exact) {
        for (const [cls, t] of [["start", start], ["end", end]]) {
          const edge = el("div", { class: `edge ${cls}` });
          edge.textContent = hm(t);
          edge.style.left = `${pos(t)}%`;
          timeline.append(edge);
        }
      }

      const head = el("div", { class: "period-head" });
      const title = el("strong");
      title.textContent = hours >= 48 ? `対象期間：直近${hours}時間（週末分を含む）` : `対象期間：直近${hours}時間`;
      const detail = el("span");
      detail.textContent = issue.period || "";
      head.append(title, detail);
      return el("div", { class: "period" }, head, timeline);
    }

    // ---------- ヒーロー ----------
    function renderHero(issue) {
      const isLatest = issue.date === state.issues[0].date;
      const eyebrow = el("span", { class: "eyebrow" });
      if (isLatest) eyebrow.append(el("span", { class: "live", "aria-hidden": "true" }));
      eyebrow.append(isLatest ? "最新のトップニュース" : "この日のトップニュース");
      const date = el("p", { class: "hero-date" });
      date.textContent = formatDate(issue.date);
      const h1 = el("h1");
      h1.textContent = issue.topHeadline || "大きな動きなし";
      return el("section", { class: "hero" }, eyebrow, date, h1, renderPeriod(issue));
    }

    // ---------- カテゴリの内訳 ----------
    function renderTiles(counts) {
      const tiles = el("div", { class: "tiles" });
      Object.entries(CATEGORIES).forEach(([cat, meta], i) => {
        const tile = el("a", { class: "tile", href: `#cat-${cat}`, "data-cat": cat });
        tile.addEventListener("click", (e) => {
          e.preventDefault();
          document.getElementById(`cat-${cat}`).scrollIntoView({ behavior: "smooth" });
        });
        const name = el("span", { class: "tile-name" });
        name.textContent = meta.name;
        const icon = el("span", { class: "icon" }, svgIcon(meta.icon));
        const desc = el("span", { class: "tile-desc" });
        desc.textContent = meta.desc;
        const num = el("span", { class: "num" });
        num.textContent = counts[cat];
        num.append(el("small", {}, "件"));
        const pips = el("span", { class: "pips", "aria-hidden": "true" });
        for (let p = 0; p < MAX_PER_CAT; p++) {
          const pip = el("span", { class: p < counts[cat] ? "pip on" : "pip" });
          pip.style.animationDelay = `${0.3 + i * 0.1 + p * 0.08}s`;
          pips.append(pip);
        }
        tile.append(el("span", { class: "tile-head" }, icon, name), desc, el("span", { class: "tile-count" }, num, pips));
        tiles.append(reveal(tile, i * 0.08));
      });
      const title = el("div", { class: "section-title" }, el("h2", {}, "カテゴリ別の件数"), el("p", {}, "各カテゴリ最大3件"));
      return el("section", { class: "section" }, title, tiles);
    }

    // ---------- 30日間の推移グラフ ----------
    function roundedTop(x, y, w, h, r) {
      r = Math.min(r, h, w / 2);
      return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
    }

    function drawChart(container, tooltip) {
      const data = [...state.issues].reverse();
      const W = Math.max(280, container.clientWidth);
      const H = 200;
      const m = { top: 8, right: 4, bottom: 24, left: 22 };
      const plotW = W - m.left - m.right;
      const plotH = H - m.top - m.bottom;
      const maxTotal = Math.max(...data.map((d) => d.counts.A + d.counts.B + d.counts.C), 1);
      const yMax = Math.max(3, Math.ceil(maxTotal / 3) * 3);
      const unit = plotH / yMax;
      const slot = plotW / data.length;
      const barW = Math.min(24, Math.max(4, slot * 0.62));
      const animate = !state.chartDrawn;

      const root = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": "日別の掲載件数（カテゴリ別の積み上げ）" });
      for (let v = 0; v <= yMax; v += 3) {
        const y = m.top + plotH - v * unit;
        root.append(svg("line", { class: v === 0 ? "baseline" : "grid-line", x1: m.left, x2: W - m.right, y1: y, y2: y }));
        const t = svg("text", { class: "axis-label", x: m.left - 6, y: y + 4, "text-anchor": "end" });
        t.textContent = v;
        root.append(t);
      }

      const selectedIndex = data.findIndex((d) => d.date === state.date);
      const labelIdx = new Set([selectedIndex]);
      const minGap = 48 / slot;
      if (Math.abs(selectedIndex) >= minGap) labelIdx.add(0);
      if (Math.abs(data.length - 1 - selectedIndex) >= minGap) labelIdx.add(data.length - 1);

      data.forEach((d, i) => {
        const cx = m.left + slot * (i + 0.5);
        const total = d.counts.A + d.counts.B + d.counts.C;
        const g = svg("g", {
          class: d.date === state.date ? "col selected" : "col",
          tabindex: "0",
          role: "button",
          "aria-label": `${formatDate(d.date)} 合計${total}件（${Object.entries(CATEGORIES).map(([c, meta]) => `${meta.name}${d.counts[c]}件`).join("、")}）`,
        });
        g.append(svg("rect", { class: "slot-bg", x: cx - slot / 2 + 1, y: m.top, width: Math.max(slot - 2, 1), height: plotH, rx: 4 }));
        let y = m.top + plotH;
        const cats = Object.keys(CATEGORIES).filter((c) => d.counts[c] > 0);
        cats.forEach((c, k) => {
          const h = d.counts[c] * unit;
          const isTop = k === cats.length - 1;
          const segH = isTop ? h : h - 2;
          y -= h;
          const segY = isTop ? y : y + 2;
          const seg = svg("path", { class: `seg ${c}`, d: roundedTop(cx - barW / 2, segY, barW, segH, isTop ? 4 : 0) });
          if (animate) seg.style.animationDelay = `${i * 0.025 + k * 0.08}s`;
          else seg.style.animation = "none";
          g.append(seg);
        });
        if (labelIdx.has(i)) {
          const t = svg("text", { class: i === selectedIndex ? "axis-label selected" : "axis-label", x: cx, y: H - 6, "text-anchor": "middle" });
          t.textContent = formatDate(d.date, false).replace(/（.）/, "");
          g.append(t);
        }

        const show = () => {
          tooltip.replaceChildren();
          const date = el("div", { class: "tt-date" });
          date.textContent = `${formatDate(d.date)}　合計${total}件`;
          const head = el("div", { class: "tt-head" });
          head.textContent = d.topHeadline;
          tooltip.append(date, head);
          for (const [c, meta] of Object.entries(CATEGORIES)) {
            const row = el("div", { class: "tt-row", "data-cat": c }, el("i"));
            row.append(meta.name, el("b", {}, `${d.counts[c]}件`));
            tooltip.append(row);
          }
          const left = Math.min(Math.max((cx / W) * container.clientWidth, 100), container.clientWidth - 100);
          tooltip.style.left = `${left}px`;
          tooltip.style.top = `${m.top}px`;
          tooltip.classList.add("show");
        };
        const hide = () => tooltip.classList.remove("show");
        g.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") show(); });
        g.addEventListener("pointerleave", hide);
        g.addEventListener("focus", show);
        g.addEventListener("blur", hide);
        const select = () => {
          hide();
          go(d.date);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        g.addEventListener("click", select);
        g.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            select();
          }
        });
        root.append(g);
      });

      container.querySelector("svg")?.remove();
      container.prepend(root);
      state.chartDrawn = true;
    }

    function renderChart() {
      const legend = el("div", { class: "legend" });
      for (const [c, meta] of Object.entries(CATEGORIES)) {
        const item = el("span", { "data-cat": c }, el("i"));
        item.append(meta.name);
        legend.append(item);
      }
      const tooltip = el("div", { class: "tooltip", role: "status" });
      const chart = el("div", { class: "chart", id: "chart" }, tooltip);

      const table = el("table");
      const headRow = el("tr", {}, el("th", {}, "日付"));
      for (const meta of Object.values(CATEGORIES)) headRow.append(el("th", {}, meta.name));
      headRow.append(el("th", {}, "合計"));
      table.append(el("thead", {}, headRow));
      const tbody = el("tbody");
      for (const d of state.issues) {
        const tr = el("tr", {}, el("td", {}, formatDate(d.date)));
        for (const c of Object.keys(CATEGORIES)) tr.append(el("td", {}, String(d.counts[c])));
        tr.append(el("td", {}, String(d.counts.A + d.counts.B + d.counts.C)));
        tbody.append(tr);
      }
      table.append(tbody);
      const details = el("details", { class: "table-view" }, el("summary", {}, "表で見る"), table);

      const card = el("div", { class: "chart-card" }, legend, chart, details);
      const title = el("div", { class: "section-title" }, el("h2", {}, "30日間の推移"), el("p", {}, "棒を押すとその日のニュースに切り替わります"));
      const section = el("section", { class: "section" }, title, reveal(card));
      requestAnimationFrame(() => drawChart(chart, tooltip));
      return section;
    }

    // ---------- ニュース ----------
    function renderCard(item, index) {
      const card = el("article", { class: "card", "data-cat": item.cat });
      const h4 = el("h4");
      h4.textContent = item.headline || "";
      card.append(h4);
      if (item.summary) {
        const p = el("p", { class: "summary" });
        p.textContent = item.summary;
        card.append(p);
      }
      if (item.why) {
        const body = el("div", {}, el("b", {}, "なぜ重要か"));
        body.append(item.why);
        card.append(el("div", { class: "why" }, svgIcon(ICON_BULB), body));
      }
      const urls = [item.url, ...(Array.isArray(item.refs) ? item.refs : [])].filter(safeUrl);
      if (urls.length) {
        const sources = el("div", { class: "sources" });
        urls.forEach((url, i) => {
          const a = el("a", { class: i === 0 ? "source primary" : "source", href: url, target: "_blank", rel: "noopener noreferrer", title: url });
          const label = el("span");
          label.textContent = i === 0 ? hostOf(url) : `参考：${hostOf(url)}`;
          a.append(svgIcon(ICON_LINK), label);
          sources.append(a);
        });
        card.append(sources);
      }
      return reveal(card, index * 0.08);
    }

    function renderNews(issue) {
      const items = Array.isArray(issue.items) ? issue.items : [];
      const section = el("section", { class: "section" }, el("div", { class: "section-title" }, el("h2", {}, "ニュース")));
      for (const [cat, meta] of Object.entries(CATEGORIES)) {
        const catItems = items.filter((item) => item.cat === cat);
        const h3 = el("h3");
        h3.textContent = meta.name;
        const badge = el("span", { class: "badge" });
        badge.textContent = `${catItems.length}件`;
        const block = el("div", { class: "cat-block", id: `cat-${cat}`, "data-cat": cat },
          el("div", { class: "cat-head" }, el("span", { class: "icon" }, svgIcon(meta.icon)), h3, badge));
        if (catItems.length) catItems.forEach((item, i) => block.append(renderCard(item, i)));
        else block.append(reveal(el("div", { class: "empty" }, svgIcon(ICON_CALM), "大きな動きなし")));
        section.append(block);
      }
      return section;
    }

    // ---------- 画面の切り替え ----------
    function updateSwitch() {
      const i = state.issues.findIndex((x) => x.date === state.date);
      document.getElementById("current-date").textContent = formatDate(state.date, false);
      document.getElementById("prev").disabled = i >= state.issues.length - 1;
      document.getElementById("next").disabled = i <= 0;
    }

    function go(date) {
      if (date === state.date) return;
      location.hash = date;
    }

    function showMessage(text) {
      document.getElementById("app").replaceChildren(el("p", { class: "message" }, text));
    }

    async function show() {
      const hash = location.hash.slice(1);
      state.date = state.issues.some((x) => x.date === hash) ? hash : state.issues[0].date;
      updateSwitch();
      let issue;
      try {
        issue = await loadIssue(state.date);
      } catch (e) {
        showMessage(`${formatDate(state.date)} のデータを読み込めませんでした。`);
        return;
      }
      const items = Array.isArray(issue.items) ? issue.items : [];
      document.getElementById("app").replaceChildren(
        renderHero(issue),
        renderTiles(countByCat(items)),
        renderNews(issue),
        renderChart(),
      );
      document.title = `AIニュース ${formatDate(issue.date)}`;
    }

    async function main() {
      let index;
      try {
        index = await fetchJson("data/index.json");
      } catch (e) {
        showMessage("データを読み込めませんでした。");
        return;
      }
      state.issues = (index.issues || []).map((x) => ({ ...x, counts: { A: 0, B: 0, C: 0, ...x.counts } }));
      if (index.generatedAt) {
        document.getElementById("generated-at").textContent = `最終更新：${index.generatedAt.replace("T", " ").slice(0, 16)}`;
      }
      if (!state.issues.length) {
        showMessage("まだニュースがありません。");
        document.getElementById("prev").disabled = true;
        document.getElementById("next").disabled = true;
        return;
      }
      document.getElementById("prev").addEventListener("click", () => {
        const i = state.issues.findIndex((x) => x.date === state.date);
        if (i < state.issues.length - 1) go(state.issues[i + 1].date);
      });
      document.getElementById("next").addEventListener("click", () => {
        const i = state.issues.findIndex((x) => x.date === state.date);
        if (i > 0) go(state.issues[i - 1].date);
      });
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const chart = document.getElementById("chart");
          if (chart) drawChart(chart, chart.querySelector(".tooltip"));
        }, 150);
      });
      window.addEventListener("hashchange", show);
      show();
    }

    main();
  </script>
</body>
</html>
